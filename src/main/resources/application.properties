spring.kafka.consumer.group-id=com.jpmc
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.IntegerSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.IntegerDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.properties[spring.json.value.default.type]=com.jpmc.midascore.foundation.Transaction
# Allow deserialization of the specific package
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.jpmc.midascore.foundation.*
server.port=33400